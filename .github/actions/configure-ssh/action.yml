name: Configure SSH
description: Configure the private key and trusted host used by the CD workflows

inputs:
  ssh-key:
    description: Private SSH key
    required: true
  host:
    description: SSH host whose public key will be registered
    required: true

runs:
  using: composite
  steps:
    - name: Install SSH credentials
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_HOST: ${{ inputs.host }}
      run: |
        set -euo pipefail
        install -d -m 700 ~/.ssh
        printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        known_host="$(ssh-keyscan -T 10 -H "${SSH_HOST}" 2>/dev/null)"
        if [ -z "${known_host}" ]; then
          echo "Could not obtain the SSH host key for ${SSH_HOST}." >&2
          exit 1
        fi
        printf '%s\n' "${known_host}" >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
