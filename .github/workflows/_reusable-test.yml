name: Reusable — Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python para rodar os testes'
        type: string
        required: true

jobs:
  test:
    name: Test (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Trivy filesystem scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            aquasec/trivy:0.63.0 \
            fs /src \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /src/trivy-results.sarif \
            --exit-code 1

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@b1722c1245f90604c2c348f9d1624af97ea8fc6e
        with:
          sarif_file: trivy-results.sarif

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Audit dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt
